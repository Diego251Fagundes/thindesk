<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lista de Chamados</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>

    <body>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <button type="button" class="toggle-btn btn btn-dark d-md-none" aria-label="Abrir ou fechar menu">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <main class="container-fluid p-4 overflow-hidden">
            <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mt-4 mt-md-0 mb-4 pb-3 border-bottom">
                <h1 class="h2 mb-0">Meus chamados</h1>
                <a th:href="@{/chamados/novo}" class="btn btn-primary ms-auto">Novo chamado</a>
            </header>
            <p th:if="${mensagem}" th:text="${mensagem}" class="alert alert-success" role="status"></p>
            <p th:if="${#lists.isEmpty(chamados)}">Você ainda não abriu nenhum chamado.</p>
            <div class="table-responsive" th:unless="${#lists.isEmpty(chamados)}">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Título</th>
                            <th scope="col">Descrição</th>
                            <th scope="col">Status</th>
                            <th scope="col">Técnico</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="chamado : ${chamados}">
                            <td class="text-break fw-semibold" th:text="${chamado.titulo ?: 'Sem título'}"></td>
                            <td class="text-break" th:text="${chamado.descricao}"></td>
                            <td th:text="${chamado.status}"></td>
                            <td th:text="${chamado.tecnico ?: 'Não atribuído'}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
