<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <body>
        <nav id="sidebar" th:fragment="sidebar" aria-label="Navegação principal">
            <h4 class="text-center py-3">Thindesk Menu</h4>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}" th:attr="aria-current=${paginaAtual == 'dashboard' ? 'page' : null}">
                        <i class="bi bi-grid" aria-hidden="true"></i> <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/chamados}" th:attr="aria-current=${paginaAtual == 'chamados' ? 'page' : null}">
                        <i class="bi bi-headset" aria-hidden="true"></i> <span>Chamados</span>
                    </a>
                </li>
            </ul>
            <form th:action="@{/logout}" method="post" class="sidebar-logout">
                <button type="submit" class="nav-link w-100 text-start">
                    <i class="bi bi-box-arrow-right" aria-hidden="true"></i> <span>Sair</span>
                </button>
            </form>
        </nav>
    </body>
</html>
