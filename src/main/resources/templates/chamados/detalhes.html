<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Detalhes do chamado - ThinDesk</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>
        <button type="button" class="toggle-btn btn btn-dark d-md-none" aria-label="Abrir ou fechar menu">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <main class="container-fluid p-4 overflow-hidden">
            <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mt-4 mt-md-0 mb-4 pb-3 border-bottom">
                <h1 class="h2 mb-0">Detalhes do chamado</h1>
                <a th:href="@{/chamados}" class="btn btn-secondary ms-auto">Voltar aos chamados</a>
            </header>
            <p th:if="${mensagem}" th:text="${mensagem}" class="alert alert-success" role="status"></p>
            <p th:if="${erro}" th:text="${erro}" class="alert alert-danger" role="alert"></p>
            <h2 class="h4 text-break" th:text="${chamado.titulo ?: 'Sem título'}"></h2>
            <p class="text-break" th:text="${chamado.descricao}"></p>
            <dl class="row">
                <dt class="col-sm-3">Status</dt>
                <dd class="col-sm-9" th:text="${chamado.status}"></dd>
                <dt class="col-sm-3">Solicitante</dt>
                <dd class="col-sm-9 text-break" th:text="${chamado.usuario}"></dd>
                <dt class="col-sm-3">Técnico</dt>
                <dd class="col-sm-9 text-break" th:text="${chamado.tecnico ?: 'Não atribuído'}"></dd>
                <dt class="col-sm-3" th:if="${chamado.dataAbertura != null}">Data de abertura</dt>
                <dd class="col-sm-9" th:if="${chamado.dataAbertura != null}" th:text="${#temporals.format(chamado.dataAbertura.atZone(T(java.time.ZoneId).of('America/Sao_Paulo')), 'dd/MM/yyyy HH:mm')}"></dd>
            </dl>
            <section th:if="${chamado.status == 'RESOLVIDO'}" aria-labelledby="titulo-solucao">
                <h2 id="titulo-solucao" class="h4 mt-4">Solução registrada</h2>
                <p class="text-break" th:text="${chamado.solucao}"></p>
                <p th:if="${chamado.dataResolucao != null}">
                    Resolvido em <span th:text="${#temporals.format(chamado.dataResolucao.atZone(T(java.time.ZoneId).of('America/Sao_Paulo')), 'dd/MM/yyyy HH:mm')}"></span>.
                </p>
            </section>
            <form th:if="${tecnico and chamado.status == 'ABERTO'}" th:action="@{/chamados/{id}/resolver(id=${chamado.id})}" th:object="${dados}" method="post">
                <div class="mb-3 mt-4">
                    <label for="solucao" class="form-label">Solução</label>
                    <textarea id="solucao" th:field="*{solucao}" class="form-control" rows="5" required aria-describedby="ajuda-solucao"></textarea>
                    <p id="ajuda-solucao" class="form-text">Descreva o atendimento realizado. Após resolver, o chamado não poderá ser alterado.</p>
                </div>
                <button type="submit" class="btn btn-primary">Resolver chamado</button>
            </form>
        </main>
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
