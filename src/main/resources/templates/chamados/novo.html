<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Novo chamado - ThinDesk</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
    </head>
    <body>
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>
        <button type="button" class="toggle-btn btn btn-dark d-md-none" aria-label="Abrir ou fechar menu">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>
        <main class="container-fluid p-4">
            <h1 class="h2 mt-4 mt-md-0 mb-3">Novo chamado</h1>
            <p>Informe o problema para solicitar atendimento. Todos os campos são obrigatórios.</p>
            <p th:if="${erro}" th:text="${erro}" class="alert alert-danger" role="alert"></p>
            <form th:action="@{/chamados}" th:object="${dados}" method="post">
                <div class="mb-3">
                    <label for="titulo" class="form-label">Título</label>
                    <input type="text" id="titulo" th:field="*{titulo}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="descricao" class="form-label">Descrição</label>
                    <textarea id="descricao" th:field="*{descricao}" class="form-control" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Abrir chamado</button>
                <a th:href="@{/chamados}" class="btn btn-secondary">Cancelar</a>
            </form>
        </main>
        <script th:src="@{/js/script.js}"></script>
    </body>
</html>
