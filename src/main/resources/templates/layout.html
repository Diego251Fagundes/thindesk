<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard - ThinDesk</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <link rel="stylesheet" th:href="@{/css/dashboard.css}">
    </head>
    <body class="dashboard-page">
        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <button type="button" class="toggle-btn btn btn-dark d-md-none" aria-label="Abrir ou fechar menu">
            <i class="bi bi-list" aria-hidden="true"></i>
        </button>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="dashboard-main">
            <div th:replace="~{home :: content}"></div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script th:src="@{/js/dashboard.js}"></script>
    </body>
</html>
